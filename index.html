<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorateur de fichiers</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #1e1f24;
            color: #eaeaea;
            height: 100dvh;
            max-height: 100dvh;
            display: flex;
        }

        /* largeur de la scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 10px;
        }

        /* fond de la scrollbar */
        ::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 10px;
        }

        /* partie mobile (le curseur) */
        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 10px;
        }

        /* hover */
        ::-webkit-scrollbar-thumb:hover {
            background: #888;
        }

        /* MAIN */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* TOP BAR */
        .topbar {
            height: 60px;
            background: #18191b;

            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #2a2b33;
            gap: 10px;
        }

        .url {
            flex: 1;
            background: #2a2b33;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .back {
            font-size: 18px;
            color: #aaa;
            cursor: pointer;
            transition: 0.2s;
            background: none;
            border: none;
            padding: 5px 10px;
        }

        /* line AREA */
        .content {
            flex: 1;
            max-width: 100dvw;

            display: flex;

            gap: 15px;


            overflow-y: scroll;

            padding: 15px;


        }

        .scroller {
            flex: 1;
            padding: 20px;

            display: flex;
            flex-direction: column;

            gap: 15px;

            overflow-y: scroll;


            border-radius: 10px;
            background: #18191b;
        }

        .line {
            background: #2a2b33;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;

            display: flex;
            align-items: center;
        }

        .line:hover {
            background: #3a3c46;
            transform: translateY(-3px);
        }


        .filename {
            font-size: 13px;
            color: #ddd;
            word-break: break-word;

            flex: 1;
        }

        .size {
            font-size: 12px;
            color: #aaa;
            margin-left: 10px;

            flex: 1;
            text-align: right;
        }

        .type {
            font-size: 12px;
            color: #888;
            margin-left: 10px;

            text-align: center;

        }

        .fileLector {
            width: 0px;
            height: 100%;
            max-height: 100%;

            display: flex;
            flex-direction: column;

            gap: 20px;

            transition: width .8s ease-out;

            border-radius: 10px;
            background: #18191b;
        }

        .fileLector.actif {

            padding: 20px;

            width: 35%;
        }

        .fileContent {
            overflow-y: scroll;

            word-wrap: break-word;
            white-space: pre-wrap;
        }


        .fileLector .header {
            justify-content: space-between;
        }



        .fileLector .header {
            display: none;
        }

        .fileLector.actif .header {
            display: flex;

        }

        .closeFileLector {
            background: none;
            border: none;
        }

        .closeFileLector svg:hover {

            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="topbar">
            <button class="back" onclick="goback()">←</button>
            <div class="url">C:\Users\Utilisateur\Documents</div>
        </div>

        <div class="content">

            <div class="scroller" id="scroller"></div>



            <div class="fileLector" id="fileLector">

                <div class="header">
                    <div class="lectorFileName">
                        Livre.txt
                    </div>

                    <button class="closeFileLector" onclick="closeFileLector()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" viewBox="0 0 24 24"
                            fill="none">
                            <path fill-rule="evenodd" clip-rule="evenodd"
                                d="M19.207 6.207a1 1 0 0 0-1.414-1.414L12 10.586 6.207 4.793a1 1 0 0 0-1.414 1.414L10.586 12l-5.793 5.793a1 1 0 1 0 1.414 1.414L12 13.414l5.793 5.793a1 1 0 0 0 1.414-1.414L13.414 12l5.793-5.793z"
                                fill="#ffffff" />
                        </svg>
                    </button>

                </div>

                <pre class="fileContent" id="fileContent"></pre>

            </div>

        </div>
        <script>

            const urlElement = document.querySelector('.url');
            const scrollerElement = document.getElementById("scroller");
            const fileLectorElement = document.getElementById("fileLector");
            const fileContent = document.getElementById("fileContent");


            function getCurrentPath() {
                window.api.getCurrentPath().then(path => {
                    urlElement.textContent = path;

                    getDirectoryContents();

                });
            }


            function getDirectoryContents() {
                window.api.getDirectoryContents(urlElement.textContent).then(contents => {
                    let temp = ""

                    contents.forEach(item => {

                        const folder = item.isDirectory;
                        const l = item.name.split(".")
                        const ext = folder ? "Directory" : item.name.split(".")[l.length - 1]


                        let onclick = ""

                        if (folder) {
                            onclick = `
                                onclick="stepTo('${item.name}')"
                            `
                        } else if (item.readable) {
                            onclick = `
                                onclick="openFile('${item.name}')"
                            `
                        }



                        const template = `
                            <div class="line" ${onclick}>
                                <div class="filename">${item.name}</div>
                                <div class="type">${ext}</div>
                                <div class="size">${item.size} Kb</div>
                            </div>
                        `

                        temp += template
                    })


                    scrollerElement.innerHTML = temp


                });
            }

            function openFile(name) {
                const filePath = urlElement.textContent + "/" + name;
                window.api.openFile(filePath).then(content => {
                    console.log(content);

                    fileContent.scrollTop = 0;
                    fileContent.textContent = content;
                    fileLectorElement.classList.add("actif");

                });

            }



            function closeFileLector() {
                fileLectorElement.classList.remove("actif");
            }

            function stepTo(name) {
                urlElement.textContent += "/" + name

                getDirectoryContents();

            }


            function goback() {
                let dirPath = urlElement.textContent;

                let parts = dirPath.split("/");
                parts.pop();
                dirPath = parts.join("/");

                urlElement.textContent = dirPath;
                getDirectoryContents();
            }


            getCurrentPath();

        </script>
</body>

</html>
