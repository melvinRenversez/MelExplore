<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorateur de fichiers</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main">

        <div class="topbar">
            <button class="back" onclick="goback()">
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" fill="#ffffff" version="1.1" id="Capa_1" width="24px" height="24px" viewBox="0 0 45.58 45.58" xml:space="preserve">
                    <g>
                        <path d="M45.506,33.532c-1.741-7.42-7.161-17.758-23.554-19.942V7.047c0-1.364-0.826-2.593-2.087-3.113   c-1.261-0.521-2.712-0.229-3.675,0.737L1.305,19.63c-1.739,1.748-1.74,4.572-0.001,6.32L16.19,40.909   c0.961,0.966,2.415,1.258,3.676,0.737c1.261-0.521,2.087-1.75,2.087-3.113v-6.331c5.593,0.007,13.656,0.743,19.392,4.313   c0.953,0.594,2.168,0.555,3.08-0.101C45.335,35.762,45.763,34.624,45.506,33.532z"/>
                    </g>
                </svg>
            </button>
            <div class="url">C:\Users\Utilisateur\Documents</div>
        </div>

        <div class="content">

            <div class="scroller" id="scroller"></div>

            <div class="sep"  id="sep"><div class="sepLine"></div></div>

            <div class="fileLector" id="fileLector">

                    <div class="header">
                        <div class="lectorFileName" id="lectorFileName">
                            Livre.txt
                        </div>

                        <button class="closeFileLector" onclick="closeFileLector()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" viewBox="0 0 24 24"
                                fill="none">
                                <path fill-rule="evenodd" clip-rule="evenodd"
                                    d="M19.207 6.207a1 1 0 0 0-1.414-1.414L12 10.586 6.207 4.793a1 1 0 0 0-1.414 1.414L10.586 12l-5.793 5.793a1 1 0 1 0 1.414 1.414L12 13.414l5.793 5.793a1 1 0 0 0 1.414-1.414L13.414 12l5.793-5.793z"
                                    fill="#ffffff" />
                            </svg>
                        </button>

                    </div>

                    <pre class="fileContent" id="fileContent">
                    </pre>

            </div>

        </div>
        <script>

            const urlElement = document.querySelector('.url');
            const scrollerElement = document.getElementById("scroller");
            const fileLectorElement = document.getElementById("fileLector");
            const sepElement = document.getElementById("sep")
            const fileContent = document.getElementById("fileContent");
            const lectorFileName = document.getElementById("lectorFileName");

            const serverUrl = "http://localhost:3000/"



            function getCurrentPath() {

                fetch(serverUrl+"getCurrentPath", {
                    method: "POST"
                })
                .then(response => response.json())
                .then(data => {
                    console.log(data);

                    urlElement.textContent = data.path;

                    getDirectoryContents();

                })


              
            }


            function getDirectoryContents() {


                fetch(serverUrl + "getDirectoryContents", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        dirPath: urlElement.textContent
                    })
                })
                .then(response => response.json())
                .then(data => {
                    console.log(data);

                    let temp = ""
                    let index =0; 

                    const contents = data.contents;

                    contents.forEach(item => {
                        index++;

                        const folder = item.isDirectory;
                        const l = item.name.split(".")
                        const ext = folder ? "Directory" : item.name.split(".")[l.length - 1]


                        let onclick = ""

                        if (folder) {
                            onclick = `
                                onclick="stepTo('${item.name}')"
                            `
                        } else if (item.readable) {
                            onclick = `
                                onclick="openFile('${item.name}')"
                            `
                        }


                        const animation = `
                        animation: lineMove 0.5s forwards ease-out;
                        animation-delay: ${index * 0.03}s;
                        `


                        const template = `
                            <div class="line" ${onclick} style="${animation}">
                                <div class="filename">${item.name}</div>
                                <div class="type">${ext}</div>
                                <div class="size">${item.size != "" ? item.size+" Kb" : ""} </div>
                            </div>
                        `

                        temp += template
                    })


                    scrollerElement.innerHTML = temp

                });

           
            }

            function openFile(name) {
                const filePath = urlElement.textContent + "/" + name;

                fetch(serverUrl+"openFile", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        filePath
                    })
                })
                .then(response => response.json())
                .then(data => {
                    console.log(data);
                    const content = data.content;

                    lectorFileName.textContent = name;

                    fileContent.scrollTop = 0;
                    fileContent.textContent = content;
                    OpenFileLector();


                })

            }







            function OpenFileLector() {
                fileLectorElement.classList.add("actif");
                sepElement.classList.add("actif");
            }

            function closeFileLector() {
                fileLectorElement.classList.remove("actif");
                sepElement.classList.remove("actif");
            }

            function stepTo(name) {
                urlElement.textContent += "/" + name

                getDirectoryContents();

            }


            function goback() {
                let dirPath = urlElement.textContent;
                let newDirPath;

                let parts = dirPath.split("/");
                parts.pop();
                newDirPath = parts.join("/");

                if (newDirPath == "") {
                    
                let parts = dirPath.split("\\");
                parts.pop();
                newDirPath = parts.join("\\");
                }

                urlElement.textContent = newDirPath;
                getDirectoryContents();
            }


            getCurrentPath();

        </script>
</body>

</html>
